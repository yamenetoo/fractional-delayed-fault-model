<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Fractional delayed fault model logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2545"/><stop offset="1" stop-color="#13315c"/>
    </linearGradient>
  </defs>
  <rect width="900" height="260" rx="18" fill="url(#bg)"/>
  <!-- ground -->
  <rect x="0" y="190" width="900" height="70" fill="#8d6e4f" opacity="0.55"/>
  <line x1="0" y1="190" x2="900" y2="190" stroke="#d9c3a5" stroke-width="2"/>
  <!-- two faults -->
  <polyline points="120,190 110,212 128,230 116,260" fill="none" stroke="#ff6b6b" stroke-width="5" stroke-linejoin="round"/>
  <polyline points="330,190 342,214 322,232 334,260" fill="none" stroke="#ffa94d" stroke-width="5" stroke-linejoin="round"/>
  <!-- delayed pulse -->
  <path d="M128,180 C190,90 260,90 322,180" fill="none" stroke="#ffd43b" stroke-width="3.5" stroke-dasharray="9 7"/>
  <polygon points="322,180 309,170 306,184" fill="#ffd43b"/>
  <text x="225" y="84" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#ffd43b" text-anchor="middle" font-style="italic">&#964; = d / c</text>
  <!-- sawtooth stress with memory (concave rise, sudden drop) -->
  <path d="M470,170 C480,110 520,84 560,74 L560,170 C570,110 610,84 650,74 L650,170 C660,110 700,84 740,74 L740,170 C750,110 790,84 830,74"
        fill="none" stroke="#74c0fc" stroke-width="4" stroke-linejoin="round"/>
  <line x1="460" y1="74" x2="850" y2="74" stroke="#69db7c" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="852" y="68" font-family="Georgia, serif" font-size="20" fill="#69db7c">&#952;</text>
  <!-- title -->
  <text x="450" y="38" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="bold">Fractional Delayed Fault Model</text>
  <text x="640" y="214" font-family="Georgia, serif" font-size="19" fill="#e9ecef" text-anchor="middle">memory D<tspan baseline-shift="super" font-size="14">&#945;</tspan>x &#183; impulses &#183; delay &#183; probabilistic forecasts</text>
</svg>
